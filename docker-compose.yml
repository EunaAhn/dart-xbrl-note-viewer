services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: xbrlnote
      POSTGRES_USER: xbrl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xbrl}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./api/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xbrl -d xbrlnote"]
      interval: 5s
      retries: 10

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://xbrl:${POSTGRES_PASSWORD:-xbrl}@db:5432/xbrlnote
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/data:ro

  web:
    image: nginx:alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  pgdata:
