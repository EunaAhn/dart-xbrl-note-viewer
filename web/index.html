<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XBRL Viewer</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --primary: #f5c400; --primary-soft: #fff7d6; --primary-light: #fffbed;
    --text: #1f2933; --text-soft: #606a76; --bg: #f6f7f9; --white: #fff;
    --border: #dfe3e8; --border-soft: #edf0f3; --danger: #c0392b;
  }
  body { margin: 0; font-family: "Pretendard", "Apple SD Gothic Neo", Arial, sans-serif; background: var(--bg); color: var(--text); }
  button, input, select { font-family: inherit; }
  .hidden { display: none !important; }

  .top-nav { height: 50px; background: var(--white); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 18px; }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 800; }
  .brand img { height: 20px; }
  .brand-fallback { width: 20px; height: 20px; background: var(--primary); border-radius: 4px; display: inline-block; }

  .layout { display: flex; min-height: calc(100vh - 50px); }
  .sidebar { width: 360px; background: var(--white); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; }
  .sidebar-title { height: 58px; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid var(--border); background: var(--primary-light); }
  .sidebar-title h2 { font-size: 16px; margin: 0; font-weight: 800; }
  .filter-section { padding: 14px 16px; border-bottom: 1px solid var(--border-soft); }
  .section-header { background: var(--primary-soft); min-height: 36px; padding: 8px 12px; display: flex; align-items: center; justify-content: space-between;
                    font-weight: 800; font-size: 13px; border: 1px solid #f0dc8a; border-radius: 6px; cursor: pointer; line-height: 1.4; }
  .section-header:hover { background: #fff1b8; }
  .filter-label { display: block; font-size: 12px; color: var(--text-soft); margin-bottom: 9px; font-weight: 700; }
  .check-row { display: flex; align-items: center; gap: 8px; height: 29px; font-size: 14px; }
  .sidebar-actions { margin-top: auto; display: grid; grid-template-columns: 1fr 1fr; height: 66px; border-top: 1px solid var(--border); }
  .reset-btn, .search-btn { border: none; font-weight: 800; cursor: pointer; font-size: 15px; }
  .reset-btn { background: var(--white); color: var(--text-soft); border-right: 1px solid var(--border); }
  .reset-btn:hover { background: #f9fafb; }
  .search-btn { background: var(--primary); color: var(--text); }
  .search-btn:hover { background: #e7b900; }

  .main-content { flex: 1; overflow: auto; display: flex; flex-direction: column; }
  .header-bar { background: #2b3036; color: #fff; padding: 20px; border-bottom: 3px solid var(--primary); }
  .header-bar h1 { margin: 0 0 10px; font-size: 28px; font-weight: 900; }
  .header-bar p { margin: 0; font-size: 14px; color: #eef1f4; }
  .badge { display: inline-block; background: var(--primary); color: var(--text); padding: 4px 8px; border-radius: 4px; font-weight: 800; margin-right: 8px; }
  .stats { display: flex; gap: 12px; margin-top: 16px; }
  .stat-card { background: #383e45; border-radius: 6px; padding: 8px 14px; min-width: 130px; }
  .stat-card strong { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
  .stat-card small { color: #c7ccd2; font-size: 11.5px; }

  .empty-state { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 120px 20px; color: var(--text-soft); }
  .empty-icon { font-size: 48px; margin-bottom: 20px; opacity: .3; }
  .empty-state h2 { margin: 0 0 16px; font-size: 20px; color: var(--text); font-weight: 700; }
  .empty-state p { margin: 0; font-size: 15px; line-height: 1.8; }

  .result-area { flex: 1; padding: 20px; background: var(--white); }
  .result-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .result-header h2 { margin: 0; font-size: 18px; font-weight: 800; }
  .result-header span { font-size: 16px; color: var(--primary); font-weight: 700; }
  .report-list { overflow-x: auto; }
  .xbrl-table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .xbrl-table th { background: #f9fafb; padding: 14px; text-align: left; font-weight: 800; border-bottom: 2px solid var(--border); }
  .xbrl-table td { padding: 12px 14px; border-bottom: 1px solid var(--border-soft); }
  .xbrl-table tbody tr:hover { background: var(--primary-light); }
  .mono { font-family: Consolas, monospace; font-size: 12px; }
  .view-btn { background: var(--primary); color: var(--text); border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-weight: 700; font-size: 13px; white-space: nowrap; }
  .view-btn:hover { background: #e7b900; }

  .modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--white); border: 1px solid var(--border); border-radius: 8px;
           z-index: 1000; width: 500px; max-width: 92vw; box-shadow: 0 10px 40px rgba(0,0,0,.15); }
  .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .modal-header h2 { margin: 0; font-size: 16px; font-weight: 800; }
  .modal-close { border: none; background: transparent; font-size: 20px; cursor: pointer; color: var(--text-soft); }
  .modal-search { padding: 12px 20px; border-bottom: 1px solid var(--border-soft); }
  .modal-search input { width: 100%; height: 36px; border: 1px solid var(--border); padding: 0 12px; border-radius: 4px; font-size: 14px; }
  .company-list { max-height: 300px; overflow-y: auto; }
  .company-item { padding: 12px 20px; border-bottom: 1px solid var(--border-soft); cursor: pointer; }
  .company-item:hover { background: var(--primary-light); }
  .company-item.selected { background: var(--primary-soft); font-weight: 700; }
  .company-item strong { display: block; margin-bottom: 4px; }
  .company-item small { display: block; font-size: 12px; color: var(--text-soft); }
  .modal-footer { padding: 12px 20px; text-align: right; border-top: 1px solid var(--border-soft); }
  .modal-confirm-btn { background: var(--primary); border: none; padding: 10px 20px; border-radius: 4px; font-weight: 800; cursor: pointer; }
  .modal-confirm-btn:hover { background: #e7b900; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.3); z-index: 999; }
  .message-box { padding: 20px; text-align: center; color: #999; }
  .error-box { padding: 20px; color: var(--danger); background: #fff1f2; border: 1px solid #fecdd3; }
</style>
</head>
<body>
<header class="top-nav">
  <div class="brand">
    <img src="/static/image1.png" alt="" onerror="this.style.display='none'; this.insertAdjacentHTML('afterend','<span class=&quot;brand-fallback&quot;></span>');">
    <span>XBRL Viewer</span>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-title"><h2>검색 조건</h2></div>

    <div class="filter-section">
      <div class="section-header" id="companySelectBtn" role="button" tabindex="0">
        <span id="selectedCompanyDisplay">회사 선택</span><span>+</span>
      </div>
    </div>

    <div class="filter-section">
      <label class="filter-label">보고서 (적재된 기간)</label>
      <div id="periodList"><div class="message-box">불러오는 중...</div></div>
    </div>

    <div class="sidebar-actions">
      <button class="reset-btn" id="resetBtn" type="button">초기화</button>
      <button class="search-btn" id="searchBtn" type="button">검색</button>
    </div>
  </aside>

  <main class="main-content">
    <div class="header-bar">
      <h1>XBRL Viewer</h1>
      <p><span class="badge">XBRL Viewer</span>는 DART 주석 일괄다운로드 데이터를 보고서별로 보여줍니다.</p>
      <div class="stats">
        <div class="stat-card"><strong id="statCompanies">—</strong><small>적재된 회사 수</small></div>
        <div class="stat-card"><strong id="statReports">—</strong><small>적재된 보고서 수</small></div>
        <div class="stat-card"><strong id="statUpdated">—</strong><small>최신 보고서 기준일</small></div>
      </div>
    </div>

    <div id="emptyState" class="empty-state">
      <div class="empty-icon">▤</div>
      <h2>원하시는 보고서를 찾아보세요</h2>
      <p>좌측 패널에서 회사를 선택하고<br>검색 버튼을 클릭해 주세요.</p>
    </div>

    <div id="resultArea" class="result-area hidden">
      <div class="result-header"><h2>검색 결과</h2><span id="resultCount">0건</span></div>
      <div class="report-list" id="reportList"></div>
    </div>
  </main>
</div>

<div id="companyModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-header">
    <h2 id="modalTitle">회사 선택</h2>
    <button id="modalCloseBtn" class="modal-close" type="button" aria-label="닫기">✕</button>
  </div>
  <div class="modal-search">
    <input id="modalCompanyInput" type="text" autocomplete="off" placeholder="회사명(한글/영문), 종목코드, 고유번호 (예: 삼성전자)">
  </div>
  <div id="companyList" class="company-list"></div>
  <div class="modal-footer"><button id="modalConfirmBtn" class="modal-confirm-btn" type="button">확인</button></div>
</div>
<div id="modalOverlay" class="modal-overlay hidden"></div>

<script>
const $ = s => document.querySelector(s);
const api = (p, q) => fetch(`/api${p}?` + new URLSearchParams(q)).then(r =>
  r.ok ? r.json() : r.json().then(e => Promise.reject(e.detail || r.statusText)));
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[c]);
}
// 보고서 종류는 적재 때 붙인 --period 라벨에서 짐작한다 (viewer.html에도 같은 함수).
const reportKind = p => /HY/.test(p) ? '반기보고서' : /Q1|1Q/.test(p) ? '1분기보고서' : /Q3|3Q/.test(p) ? '3분기보고서'
  : /FY/.test(p) ? '사업보고서' : p;
const ymd = d => d ? `${d.slice(0, 4)}-${d.slice(4, 6)}-${d.slice(6)}` : '-';

// period → 그 기간의 회사 목록. 회사 검색은 전 기간을 합친 목록에서 브라우저가 한다.
const byPeriod = {};
let companies = [], picked = null, selected = null;

async function init() {
  const periods = await api('/periods');
  $('#periodList').innerHTML = periods.map((p, i) =>
    `<div class="check-row"><input type="checkbox" id="p${i}" value="${esc(p)}" checked><label for="p${i}">${esc(reportKind(p))} (${esc(p)})</label></div>`
  ).join('') || '<div class="message-box">적재된 보고서가 없습니다.</div>';
  await Promise.all(periods.map(async p => { byPeriod[p] = await api('/companies', { period: p }); }));
  const seen = new Map();
  Object.values(byPeriod).flat().forEach(c => seen.has(c.corp_code) || seen.set(c.corp_code, c));
  companies = [...seen.values()];
  api('/stats').then(s => {
    $('#statCompanies').textContent = s.company_count.toLocaleString('ko-KR');
    $('#statReports').textContent = s.report_count.toLocaleString('ko-KR');
    $('#statUpdated').textContent = s.last_report_date || '—';
  }).catch(() => {});
}

/* ---- 회사 선택 팝업 ---- */
function openCompanyModal() {
  $('#companyModal').classList.remove('hidden');
  $('#modalOverlay').classList.remove('hidden');
  if (!$('#modalCompanyInput').value.trim()) $('#companyList').innerHTML = '<div class="message-box">회사명을 2글자 이상 입력하세요.</div>';
  setTimeout(() => $('#modalCompanyInput').focus(), 50);
}
function closeCompanyModal() {
  $('#companyModal').classList.add('hidden');
  $('#modalOverlay').classList.add('hidden');
}

function filterCompanies(q) {
  picked = null;
  const needle = q.trim().toLowerCase(), box = $('#companyList');
  if (needle.length < 2) return box.innerHTML = '<div class="message-box">2글자 이상 입력하세요.</div>';
  const hits = companies.filter(c => [c.name, c.eng_name, c.corp_code, c.stock_code]
    .some(s => s && s.toLowerCase().includes(needle))).slice(0, 50);
  if (!hits.length) return box.innerHTML = '<div class="message-box">검색 결과 없음</div>';
  box.innerHTML = hits.map(c => `<div class="company-item" data-code="${c.corp_code}">
      <strong>${esc(c.name)}</strong>
      <small>고유 번호: ${c.corp_code}${c.stock_code ? ' · 종목코드: ' + c.stock_code : ''}${c.eng_name && c.eng_name !== c.name ? ' · ' + esc(c.eng_name) : ''}</small></div>`).join('');
  box.querySelectorAll('.company-item').forEach(el => {
    el.onclick = () => {
      box.querySelectorAll('.selected').forEach(x => x.classList.remove('selected'));
      el.classList.add('selected');
      picked = companies.find(c => c.corp_code === el.dataset.code);
    };
    el.ondblclick = confirmCompany;
  });
}

function confirmCompany() {
  if (!picked) return alert('회사를 선택해주세요.');
  selected = picked;
  $('#selectedCompanyDisplay').textContent = `${selected.name} (${selected.stock_code || selected.corp_code})`;
  closeCompanyModal();
}

/* ---- 검색: 선택한 기간들 중 그 회사가 제출한 보고서 ---- */
function handleSearch() {
  if (!selected) return alert('회사를 선택해주세요.');
  const periods = [...document.querySelectorAll('#periodList input:checked')].map(i => i.value);
  if (!periods.length) return alert('보고서를 하나 이상 선택해주세요.');
  const reports = periods.flatMap(p => (byPeriod[p] || []).filter(c => c.corp_code === selected.corp_code).map(c => ({ ...c, period: p })));
  $('#emptyState').classList.add('hidden');
  $('#resultArea').classList.remove('hidden');
  $('#resultCount').textContent = `${reports.length}건`;
  $('#reportList').innerHTML = !reports.length ? '<div class="message-box">검색 결과 없음</div>' : `
    <table class="xbrl-table"><thead><tr>
      <th style="width:23%">회사명</th><th style="width:25%">보고서 유형</th><th style="width:15%">기준일</th>
      <th style="width:12%">종목코드</th><th style="width:12%">고유번호</th><th style="width:13%">작업</th></tr></thead>
    <tbody>${reports.map(r => `<tr>
      <td>${esc(r.name)}</td><td>${esc(reportKind(r.period))} <span class="mono">(${esc(r.period)})</span></td>
      <td>${ymd(r.report_date)}</td><td class="mono">${r.stock_code || '-'}</td><td class="mono">${r.corp_code}</td>
      <td><a class="view-btn" style="text-decoration:none" target="_blank" rel="noopener"
             href="/viewer.html?${new URLSearchParams({ cik: r.corp_code, period: r.period })}">XBRL 보기</a></td></tr>`).join('')}
    </tbody></table>`;
}

$('#companySelectBtn').onclick = openCompanyModal;
$('#companySelectBtn').onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openCompanyModal(); } };
$('#modalCloseBtn').onclick = closeCompanyModal;
$('#modalOverlay').onclick = closeCompanyModal;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCompanyModal(); });
$('#modalCompanyInput').oninput = e => filterCompanies(e.target.value);
$('#modalCompanyInput').onkeydown = e => { if (e.key === 'Enter') confirmCompany(); };
$('#modalConfirmBtn').onclick = confirmCompany;
$('#searchBtn').onclick = handleSearch;
$('#resetBtn').onclick = () => location.reload();

init().catch(e => $('#periodList').innerHTML = `<div class="error-box">불러오기 오류: ${esc(e)}</div>`);
</script>
</body>
</html>
