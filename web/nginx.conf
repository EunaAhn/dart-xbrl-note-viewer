server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    location / {
        # index.html이 곧 앱 전체라 빌드 해시가 없다. 캐시를 두면 고친 게 반영
        # 안 된 화면을 계속 보게 된다.
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
